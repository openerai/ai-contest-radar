name: 소스 접근성 진단

# GitHub 러너(미국 IP)에서 어떤 국내 공모전 사이트가 열리는지 확인하는 진단용.
# 수집 파이프라인과 무관하며, 수동 실행 전용입니다.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: 접근성 진단
        run: |
          set -o pipefail
          python scripts/probe_sources.py | tee probe.log
          {
            echo '### 소스 접근성 (GitHub 러너 기준)'
            echo '```'
            cat probe.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
