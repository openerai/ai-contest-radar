name: 공모전 데이터 주간 갱신

on:
  schedule:
    # 일요일 21:00 UTC = 월요일 06:00 KST (한국 시간 월요일 아침)
    - cron: "0 21 * * 0"
  workflow_dispatch:          # Actions 탭에서 수동 실행 가능
    inputs:
      wevity_limit:
        description: "위비티 분야당 최대 조회 건수"
        default: "15"
      afc_limit:
        description: "aifilmcontests 최대 조회 건수"
        default: "90"

# GitHub Pages 를 "Deploy from a branch" 로 쓰므로 커밋 권한만 있으면 됩니다.
permissions:
  contents: write

concurrency:
  group: contest-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: 의존성 설치
        run: pip install -r scripts/requirements.txt

      - name: 공모전 수집
        id: scrape
        run: |
          python scripts/update_contests.py \
            --wevity-limit "${{ github.event.inputs.wevity_limit || '15' }}" \
            --afc-limit    "${{ github.event.inputs.afc_limit    || '90' }}" \
            | tee run.log
        # 스크립트는 수집량이 직전의 절반 미만이면 0이 아닌 코드로 끝난다.
        # (소스 사이트 구조가 바뀌었을 때 잘못된 데이터를 덮어쓰지 않기 위함)

      - name: 변경 요약
        if: always()
        run: |
          echo '### 수집 결과' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat run.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '### 변경된 파일' >> $GITHUB_STEP_SUMMARY
          git --no-pager diff --stat >> $GITHUB_STEP_SUMMARY || true

      - name: 커밋 & 푸시
        run: |
          rm -f run.log
          if git diff --quiet -- data index.html global.html; then
            echo "변경 없음 — 커밋 건너뜀"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data index.html global.html
          git commit -m "chore: 공모전 데이터 자동 갱신 ($(date -u +%Y-%m-%d))"
          git push
